name: CI

on:
  pull_request:
    branches: [develop, master]

jobs:
  security-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BackEnd/CvEvaluator.Api/CvEvaluator.Api.csproj

      - name: Build
        run: dotnet build BackEnd/CvEvaluator.Api/CvEvaluator.Api.csproj --no-restore -c Release

  dotnet-audit:
    name: .NET dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check vulnerable packages
        run: dotnet list BackEnd/CvEvaluator.Api/CvEvaluator.Api.csproj package --vulnerable --include-transitive

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [production, staging]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: FrontEnd/cv-evaluator-ui/package-lock.json

      - name: Install
        run: npm ci
        working-directory: FrontEnd/cv-evaluator-ui

      - name: Build (${{ matrix.configuration }})
        run: npm run build -- --configuration ${{ matrix.configuration }}
        working-directory: FrontEnd/cv-evaluator-ui

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit production dependencies
        run: npm audit --production || true
        working-directory: FrontEnd/cv-evaluator-ui
