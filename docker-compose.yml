services:
  postgres:
    image: postgres:16-alpine
    container_name: cvevaluator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvevaluator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: francis1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvevaluator"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cvevaluator-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | head -1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cvevaluator-net

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ollama
    command: pull llama3:8b
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cvevaluator-net
    restart: "no"

  api:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    image: cvevaluator-api:latest
    container_name: cvevaluator-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=cvevaluator;Username=postgres;Password=francis1
      - Jwt__Key=SUPER_SECRET_KEY_MINIMO_32_CHARS
      - Jwt__Issuer=CvEvaluator
      - Jwt__Audience=CvEvaluatorUsers
      - Ollama__BaseUrl=http://host.docker.internal:11434
      - LlmProvider=Ollama
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cvevaluator-net
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:

networks:
  cvevaluator-net:
    driver: bridge
