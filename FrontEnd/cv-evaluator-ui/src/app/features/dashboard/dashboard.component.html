<div class="max-w-2xl mx-auto px-4 py-12">

  <h1 class="text-3xl font-bold text-gray-800 mb-8">Dashboard</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10">

    <div class="bg-white shadow rounded-lg p-6">
      <h3 class="text-sm font-medium text-gray-500 mb-1">Total Job Positions</h3>
      <p class="text-4xl font-bold text-blue-600">{{ totalPositions() }}</p>
    </div>

    @if (subscription(); as sub) {
      <div class="bg-white shadow rounded-lg p-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-medium text-gray-500">Plan</h3>
          <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{{ sub.planName }}</span>
        </div>
        <p class="text-sm text-gray-600">
          <span class="font-semibold text-gray-800">{{ sub.evaluationsUsedThisMonth }}</span>
          / {{ formatLimit(sub.maxEvaluationsPerMonth) }} evaluations this month
        </p>
        <a routerLink="/subscription" class="text-xs text-blue-500 hover:underline mt-2 inline-block">
          View plan details →
        </a>
      </div>
    }

  </div>

  <div class="flex gap-4">

    <a routerLink="/job-positions/create"
       class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition-colors">
      Create Job Position
    </a>

    <a routerLink="/job-positions"
       class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-5 py-2.5 rounded-lg transition-colors">
      View Job Positions
    </a>

  </div>

</div>
