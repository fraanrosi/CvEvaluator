<div class="max-w-2xl mx-auto px-4 py-8">

  <h2 class="text-2xl font-bold text-gray-800 mb-6">Create Job Position</h2>

  <div class="bg-white shadow rounded-lg p-6">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input formControlName="title"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea rows="8" formControlName="description"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      @if (errorMessage()) {
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
          <span class="font-semibold">Limit reached:</span> {{ errorMessage() }}
          <a routerLink="/subscription" class="ml-2 underline font-medium hover:text-red-900">View plans →</a>
        </div>
      }

      <button type="submit" [disabled]="form.invalid"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        Create
      </button>

    </form>
  </div>

</div>
