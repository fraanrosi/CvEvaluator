<div class="page-container max-w-2xl">

  <h2 class="section-title mb-6">Create Job Position</h2>

  <div class="card p-6">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

      <div>
        <label class="label">Title</label>
        <input formControlName="title"
               placeholder="e.g. Senior Frontend Developer"
               class="input-field" />
      </div>

      <div>
        <label class="label">Description</label>
        <textarea rows="8" formControlName="description"
                  placeholder="Describe the requirements, responsibilities, and qualifications..."
                  class="input-field resize-y"></textarea>
      </div>

      @if (errorMessage()) {
        <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-lg px-4 py-3 text-sm">
          <span class="font-semibold">Limit reached:</span> {{ errorMessage() }}
          <a routerLink="/subscription" class="ml-2 underline font-medium text-accent hover:text-accent-light">View plans →</a>
        </div>
      }

      <button type="submit" [disabled]="form.invalid"
              class="btn-primary w-full">
        Create
      </button>

    </form>
  </div>

</div>
